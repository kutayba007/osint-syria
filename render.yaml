# ============================================
# 🇸🇾 OSINT Syria — Render Deployment Config
# ============================================
# Deploy to Render (Free Tier)
#
# 1. Go to https://dashboard.render.com
# 2. Click "New" → "Web Service"
# 3. Connect GitHub repo: kutayba007/osint-syria
# 4. Set these build/start commands
# 5. Add environment variables below
# 6. Click "Create Web Service"

services:
  - name: osint-syria-api
    type: web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    envVars:
      # Python path must match Dockerfile WORKDIR (/app)
      - key: PYTHONPATH
        value: /app
      - key: PYTHONUNBUFFERED
        value: "1"
      # ── Telegram credentials (set these in Render Dashboard) ──
      # The code reads TG_API_ID, TG_API_HASH, TG_BOT_TOKEN, TG_CHAT_ID
      # NOT TELEGRAM_API_ID — that's a different name!
      - key: TG_API_ID
        sync: false
      - key: TG_API_HASH
        sync: false
      - key: TG_BOT_TOKEN
        sync: false
      - key: TG_CHAT_ID
        sync: false
      # ── Supabase (set these in Render Dashboard) ──
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      # ── Groq AI (set this in Render Dashboard) ──
      - key: GROQ_API_KEY
        sync: false
