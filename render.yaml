# ============================================
# 🇸🇾 OSINT Syria — Render Deployment Config
# ============================================
# Deploy to Render (Free Tier)
#
# 1. Go to https://dashboard.render.com
# 2. Click "New" → "Web Service"
# 3. Connect GitHub repo: kutayba007/osint-syria
# 4. Set these build/start commands
# 5. Add environment variables below
# 6. Click "Create Web Service"

services:
  - name: osint-syria-api
    type: web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
